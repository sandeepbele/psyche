{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>I know you</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    

</head>
<body>
    <div class="container">
        
   
    <div class="text-center m-5" id="loading">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
    </div>


    <div class="container" id="fingerprint-container">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody id="fp-data">
                </tbody>
            </table>
            <canvas id="myChart"></canvas>
        </div>
    </div>
    </div>
    <script src="{% static 'driver.js' %}"></script>
    <script>
        const loadingDiv = document.getElementById('loading');
        const fpContainerDiv = document.getElementById('fingerprint-container');

        const fingerprintDataDiv = document.getElementById('fp-data');

        // Call the getFingerprintData function from driver.js
        async function fetchData() {
            const data = await driver.getFingerprintData('{% url "decode" %}');
            console.log(data);

            // Populate the table with data
            for (const key in data.result) {
                const row = document.createElement('tr');
                const keyCell = document.createElement('td');
                const valueCell = document.createElement('td');
                keyCell.textContent = key;
                valueCell.textContent = typeof data.result[key] === 'object' ? JSON.stringify(data.result[key]) : data.result[key];
                row.appendChild(keyCell);
                row.appendChild(valueCell);
                fingerprintDataDiv.appendChild(row);
            }
            // Hide the loading spinner
            loadingDiv.style.display = 'none';
            fpContainerDiv.style.display = 'block';

        }

        try {
            fpContainerDiv.style.display = 'none';  // Hide the fingerprint data container
            // Show the loading spinner
            loadingDiv.style.display = 'block';
            fetchData();
        } catch (err) {
            console.log(err);
        }
    </script>
    
</body>
</html>
