<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio Processing and Polling</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body class="container py-5">

<div id="uploadNotification" class="alert" style="display: none;"></div>

<form id="uploadForm" class="mb-3">
    <div class="mb-3">
        <input class="form-control" type="file" name="audio_file" required>
    </div>
    <button type="submit" class="btn btn-primary">Upload Audio</button>
</form>

<div class="progress" style="height: 20px; display: none;" id="progressBarContainer">
    <div id="uploadProgress" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
</div>


<button id="stopPollingButton" class="btn btn-secondary mt-3" style="display: none;">Stop Polling</button>

<div id="artifacts" class="mt-3">
    <div class="container py-5">
        <div class="row">
            <div class="col-md-6" id="asrResults">
                <h4>ASR Results</h4>
                <!-- ASR records will be appended here -->
            </div>
            <div class="col-md-6" id="llmResults">
                <h4>LLM Results</h4>
                <!-- LLM records will be appended here -->
            </div>
        </div>
    </div>    
</div>

<script>

document.getElementById('uploadForm').addEventListener('submit', function(event) {
    event.preventDefault();
    const file = document.querySelector('input[type="file"]').files[0];
    const reader = new FileReader();
    reader.readAsArrayBuffer(file);

    reader.onload = async function() {
        const audioContext = new AudioContext();
        const audioBuffer = await audioContext.decodeAudioData(reader.result);
        
        // Calculate the number of 30-second chunks
        const chunkDuration = 30; // seconds
        const numberOfChunks = Math.ceil(audioBuffer.duration / chunkDuration);

        for (let i = 0; i < numberOfChunks; i++) {
            // Calculate start and end times for each chunk
            const startTime = i * chunkDuration;
            const endTime = Math.min((i + 1) * chunkDuration, audioBuffer.duration);

            // Extract the chunk (this function needs to be implemented)
            const chunkBuffer = extractChunk(audioContext, audioBuffer, startTime, endTime);

            // Convert the chunkBuffer to a Blob and send it to the server
            // (convertToBlob and sendChunkToServer functions need to be implemented)
            const chunkBlob = convertToBlob(chunkBuffer);
            await sendChunkToServer(chunkBlob, i);
        }
    };
});


function extractChunk(audioContext, audioBuffer, startTime, endTime) {
    const sampleRate = audioBuffer.sampleRate;
    const startOffset = Math.floor(startTime * sampleRate);
    const endOffset = Math.floor(endTime * sampleRate);
    const frameCount = endOffset - startOffset;

    // Mono audio: only one channel
    const chunkBuffer = audioContext.createBuffer(
        1, frameCount, sampleRate
    );

    const audioBufferData = audioBuffer.getChannelData(0); // Mono channel
    const chunkBufferData = chunkBuffer.getChannelData(0);
    for (let i = startOffset, j = 0; i < endOffset; i++, j++) {
        chunkBufferData[j] = audioBufferData[i];
    }

    return chunkBuffer;
}

function audioBufferToWav(buffer, opts) {
    opts = opts || {};
    const numChannels = opts.isMono ? 1 : buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1; // PCM format
    const bitDepth = 16;

    let blockAlign = numChannels * bitDepth / 8;
    let byteRate = sampleRate * blockAlign;
    let dataSize = buffer.length * numChannels * 2; // 2 bytes per sample per channel
    let bufferLength = 44 + dataSize; // 44 bytes for header

    let arrayBuffer = new ArrayBuffer(bufferLength);
    let view = new DataView(arrayBuffer);

    // Writing WAV header
    writeString(view, 0, 'RIFF'); // ChunkID
    view.setUint32(4, 36 + dataSize, true); // ChunkSize
    writeString(view, 8, 'WAVE'); // Format
    writeString(view, 12, 'fmt '); // Subchunk1ID
    view.setUint32(16, 16, true); // Subchunk1Size
    view.setUint16(20, format, true); // AudioFormat
    view.setUint16(22, numChannels, true); // NumChannels
    view.setUint32(24, sampleRate, true); // SampleRate
    view.setUint32(28, byteRate, true); // ByteRate
    view.setUint16(32, blockAlign, true); // BlockAlign
    view.setUint16(34, bitDepth, true); // BitsPerSample
    writeString(view, 36, 'data'); // Subchunk2ID
    view.setUint32(40, dataSize, true); // Subchunk2Size

    // Converting AudioBuffer to 16-bit PCM
    let offset = 44;
    for (let i = 0; i < buffer.length; i++) {
        for (let channel = 0; channel < numChannels; channel++) {
            let sample = buffer.getChannelData(channel)[i];
            sample = Math.max(-1, Math.min(1, sample)); // Clamping
            view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
            offset += 2;
        }
    }

    return arrayBuffer;
}

function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
    }
}


function convertToBlob(buffer) {
    // Use an AudioBuffer to WAV encoder for mono audio
    // Example: audioBufferToWav(buffer, { isMono: true }) function which needs to be implemented
    const wavArrayBuffer = audioBufferToWav(buffer, { isMono: true });
    return new Blob([wavArrayBuffer], { type: 'audio/wav' });
}

async function sendChunkToServer(blob, chunkIndex) {
    const formData = new FormData();
    formData.append('audio_file', blob, `chunk_${chunkIndex}.wav`);

    try {
        const response = await fetch('/process_audio/', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        console.log(`Chunk ${chunkIndex} processed:`, result);

        if (result && result.pipeline_run_id && result.task_id) {
            // Start polling for artifacts if the upload was successful
            await startPolling(result.pipeline_run_id,result.task_id);
        }
        // Update UI based on response
    } catch (error) {
        console.error(`Error sending chunk ${chunkIndex}:`, error);
        // Handle errors, update UI accordingly
    }
}

function startPolling(pipelineRunId, taskId) {
    const pollFrequency = 5000; // 5 seconds
    const artifactsEndpoint = `/api/artifacts/${pipelineRunId}/${taskId}`;
    stopPollingButton.style.display = 'block';

    const delay = duration => new Promise(resolve => setTimeout(resolve, duration));

    async function poll() {
        try {
            const response = await fetch(artifactsEndpoint);
            const data = await response.json();

            if (typeof data === 'string') {
                data = JSON.parse(data);
            }
            if (typeof data.artifacts === 'string') {
                data.artifacts = JSON.parse(data.artifacts);
            }
            if (data.artifacts && data.artifacts.length > 0) {
                displayResults(data.artifacts);
            }
            if (data.run_completed) {
                stopPollingButton.style.display = 'none';
                return // Exit the polling loop
            } 

            await delay(pollFrequency);
            poll(); // Recursive call
        } catch (error) {
            console.error('Error fetching artifacts:', error);
        }
    }

    poll(); // Initial call

    stopPollingButton.addEventListener('click', function() {
        stopPollingButton.style.display = 'none';
        // Stop the polling. Implement logic to break out of the recursive calls.
    });
}

function processLlmData(llmData) {
    // Risk Meter based on social_engineering and scam values
    const riskLevel = llmData.social_engineering === 'True' || llmData.scam !== 'False' ? 'High Risk' : 'Low Risk';
    const riskClass = riskLevel === 'High Risk' ? 'btn-danger' : 'btn-success';

    // Formatting emotions
    const agentEmotions = JSON.parse(llmData.agent_emotions).join(', ');
    const customerEmotions = JSON.parse(llmData.customer_emotions).join(', ');

    return `
        <div class="risk-meter mb-2"><strong>Risk Meter: </strong><button class="btn ${riskClass}">${riskLevel}</button></div>
        <div class="reasoning mb-2"><strong>Reasoning: </strong>${llmData.reasoning}</div>
        <div class="emotions mb-2">
            <strong>Agent Emotions: </strong>${agentEmotions}<br>
            <strong>Customer Emotions: </strong>${customerEmotions}
        </div>
    `;
}

function displayResults(data) {
    const asrResultsContainer = document.getElementById('asrResults');
    const llmResultsContainer = document.getElementById('llmResults');
    let asrChunk = 1;
    let llmChunk = 1;

    data.forEach((artifact, index) => {
        // Assuming the ASR and LLM records are in pairs and in order
        if (artifact.fields.processor_type === 'asr') {
            const asrData = JSON.parse(artifact.fields.data);
            const asrElement = document.createElement('div');
            asrElement.className = 'artifact asr';
            asrElement.innerHTML = `<p><strong>Chunk ${asrChunk} - ASR:</strong> ${asrData.speaker_segments.map(segment => `[${segment.speaker}]: ${segment.text}`).join('<br>')}</p>`;
            asrResultsContainer.appendChild(asrElement);
            asrChunk++;
        } else if (artifact.fields.processor_type === 'llm') {
            const llmData = JSON.parse(artifact.fields.data); // Assuming LLM data structure is similar or adjust accordingly
            const llmElement = document.createElement('div');
            llmElement.className = 'artifact llm';
            llmElement.innerHTML = processLlmData(llmData.parsed_response);
            llmResultsContainer.appendChild(llmElement);
            llmChunk++;
        }
    });
}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

</body>
</html>
