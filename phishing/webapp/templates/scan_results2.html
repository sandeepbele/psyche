<script>
// Insert your polling function here

// Function to initiate the scan
async function initiateScan() {
    // Clear previous results

  displayResults([])
  const urlInput = document.querySelector('input[type="text"]').value; // Get the URL from the input field
  const formData = new FormData();
  formData.append('url', urlInput);

  // Update the progress bar to show the beginning of the process
  //const progressBar = document.getElementById('progressBar');
  //progressBar.style.width = '0%';
  //progressBar.setAttribute('aria-valuenow', '0');

  // Show the spinner
  document.getElementById('spinner').style.display = 'block';

  // Send the URL to the /initiate_scan endpoint using fetch
  try {
    const response = await fetch('/initiate_url_scan/', {
      method: 'POST',
      body: formData // Send the form data with the URL
    });

    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }

    const data = await response.json();
    const { pipeline_run_id, task_id } = data;
    const timeout = 300000; // Polling timeout in milliseconds

    // Call the polling function and wait for results
    const artifacts = await pollForResults(pipeline_run_id, task_id, timeout);

    // Hide the spinner
    document.getElementById('spinner').style.display = 'none';

    // Display results in the table
    displayResults(artifacts);

  } catch (error) {
    console.error('Error during scan initiation:', error);
    // Hide the spinner and reset the progress bar if an error occurs
    document.getElementById('spinner').style.display = 'none';
    progressBar.style.width = '0%';
    progressBar.setAttribute('aria-valuenow', '0');
    // Optionally, handle the error e.g., display an error message to the user
  }
}

function updateProgressBar(percentage) {
    const progressBarContainer = document.getElementById('progressBarContainer');
    progressBarContainer.style.display = 'block';
    const progressBar = document.getElementById('progressBar');
    progressBar.style.width = percentage + '%';
    progressBar.setAttribute('aria-valuenow', percentage);
    progressBar.textContent = percentage.toFixed(0) + '%';
}

// Simplified polling function
async function pollForResults(pipelineRunId, taskId, timeout) {
    const pollFrequency = 5000; // 5 seconds
    const artifactsEndpoint = `/api/artifacts/${pipelineRunId}/${taskId}`;
    const deadline = Date.now() + timeout;
    let allArtifacts = []; // To store all artifacts

    while (Date.now() < deadline) {
        try {
            const response = await fetch(artifactsEndpoint);
            const data = await response.json();

            if (typeof data === 'string') {
                data = JSON.parse(data);
            }
            if (typeof data.artifacts === 'string') {
                data.artifacts = JSON.parse(data.artifacts);
            }

            // Append new artifacts to the allArtifacts array
            if (data.artifacts && data.artifacts.length > 0) {
                allArtifacts = allArtifacts.concat(data.artifacts);
            }

            if (data.run_completed) {
                return allArtifacts; // Return all collected artifacts
            }
        } catch (error) {
            console.error('Error fetching artifacts:', error);
        }

        await new Promise(resolve => setTimeout(resolve, pollFrequency));
    }

    throw new Error('Polling timed out');
}

function objectToString(obj) {
    if (typeof obj === 'object' && obj !== null) {
        return JSON.stringify(obj, null, 2);
    }
    return obj;
}

function displayResults(data) {
  const resultsTableBody = document.getElementById('resultsTable').getElementsByTagName('tbody')[0];
  const screenshotColumn = document.getElementById('screenshotColumn');
  resultsTableBody.innerHTML = ''; // Clear previous results
  screenshotColumn.innerHTML = ''; // Clear previous screenshot

  data.forEach((artifact, index) => {
    if (artifact.fields.processor_type === 'phish_scan_url_screenshot_ocr') {
      const artifactData = JSON.parse(artifact.fields.data);
      // Display the screenshot in the right column
      const img = document.createElement('img');
      img.src = `data:image/png;base64,${artifactData.screenshot_b64}`;
      img.classList.add('img-fluid');
      img.alt = 'Scan Screenshot';
      screenshotColumn.appendChild(img);
    } 

    if (artifact.fields.processor_type === 'phish_scan_screenshot_assessment') {
        const artifactData = JSON.parse(artifact.fields.data);
        // Display each piece of data as a row in the table
        for (const key in artifactData) {
            const tr = document.createElement('tr');
            let value = objectToString(artifactData[key]);

            // Check if 'is_phishing' is true
            if (key === 'is_phishing' && artifactData[key] === true) {
                tr.classList.add('table-danger'); // Add 'table-danger' class for Bootstrap
            }

            // Check if key is 'brand' and 'is_phishing' is true
            if (key === 'brand' && artifactData['is_phishing'] === true) {
                value = '[impersonated] ' + value;
            }

            tr.innerHTML = `<td>${key}</td><td>${value}</td>`;
            resultsTableBody.appendChild(tr);
        }
    }
  });
}

</script>
